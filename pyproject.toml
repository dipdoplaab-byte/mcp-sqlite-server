[project]
name = "mcp-sqlite-server"
version = "1.0.0"
description = "MCP server for querying and managing SQLite databases"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0.0"]

[project.scripts]
mcp-sqlite-server = "server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]